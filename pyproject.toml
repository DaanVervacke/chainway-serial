[build-system]
requires = ["uv_build>=0.12.21,<0.13"]
build-backend = "uv_build"

[project]
name = "chainway-serial"
version = "0.2.0"
description = "Asynchronous Python library for Chainway UR4 UHF RFID readers over serial and TCP"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{ name = "Daan Vervacke", email = "daan.vervacke@proton.me" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Hardware",
    "Typing :: Typed",
]
keywords = [
    "chainway",
    "ur4",
    "uhf",
    "rfid",
    "epc",
    "gen2",
    "serial",
    "tcp",
    "serialx",
    "asyncio",
    "home-assistant",
]
dependencies = ["serialx>=1.10"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "mypy>=1.13",
    "ruff>=0.16",
    "coverage[toml]>=7.15.2",
]
docs = [
    "furo>=2025.12.19",
    "sphinx>=9.1.0",
]

[project.urls]
Homepage = "https://github.com/DaanVervacke/chainway-serial"
Repository = "https://github.com/DaanVervacke/chainway-serial"
Issues = "https://github.com/DaanVervacke/chainway-serial/issues"
Changelog = "https://github.com/DaanVervacke/chainway-serial/blob/main/CHANGELOG.md"
Documentation = "https://chainway-serial.readthedocs.io/"

[tool.uv]
required-version = ">=0.12.21,<0.13"

[tool.uv.build-backend]
source-include = ["LICENSE"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".claude", ".agents", ".codex", ".continue"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "ISC001",
    "ANN401",
    "PLR0913",
    "PLR0917",
    "TC001",
    "TC002",
    "TC003",
    "CPY001",
    "D203",
    "D213",
    "D413",
]

[tool.ruff.lint.per-file-ignores]
"scripts/check.py" = ["T201", "S603", "D"]
"scripts/probe_chainway.py" = ["T201", "S105", "PLR2004", "D"]
"docs/conf.py" = ["INP001", "D"]
"tests/**" = [
    "S101",
    "S105",
    "S106",
    "SLF001",
    "PLR2004",
    "RUF059",
    "FBT003",
    "D",
]
"hardware/**" = [
    "S101",
    "S105",
    "S106",
    "SLF001",
    "PLR2004",
    "RUF059",
    "FBT003",
    "D",
]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 98

[tool.mypy]
python_version = "3.14"
strict = true
